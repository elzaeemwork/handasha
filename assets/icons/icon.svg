<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E4AAE"/>
      <stop offset="100%" stop-color="#1E3580"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>
  <!-- 3D Cube frame (left portion) -->
  <g transform="translate(110, 130)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back face of cube -->
    <polygon points="60,0 160,0 160,100 60,100" fill="none" stroke="#3657C8" stroke-width="8" opacity="0.5"/>
    <!-- Front face of cube -->
    <polygon points="20,50 120,50 120,150 20,150" fill="none" stroke="#3657C8" stroke-width="10"/>
    <!-- Connecting edges -->
    <line x1="20" y1="50" x2="60" y2="0" stroke="#3657C8" stroke-width="8" opacity="0.7"/>
    <line x1="120" y1="50" x2="160" y2="0" stroke="#3657C8" stroke-width="8" opacity="0.7"/>
    <line x1="120" y1="150" x2="160" y2="100" stroke="#3657C8" stroke-width="8" opacity="0.7"/>
    <!-- Front face fill -->
    <polygon points="20,50 120,50 120,150 20,150" fill="#3657C8" opacity="0.15"/>
    <!-- Top face fill -->
    <polygon points="20,50 60,0 160,0 120,50" fill="#3657C8" opacity="0.25"/>
    <!-- Side face fill -->
    <polygon points="120,50 160,0 160,100 120,150" fill="#3657C8" opacity="0.2"/>
  </g>
  <!-- Open book (right portion) -->
  <g transform="translate(240, 170)">
    <!-- Left page -->
    <path d="M80,10 C60,5 20,0 0,15 L0,160 C20,145 60,148 80,155 Z" fill="white" opacity="0.95"/>
    <!-- Right page -->
    <path d="M80,10 C100,5 140,0 160,15 L160,160 C140,145 100,148 80,155 Z" fill="white" opacity="0.85"/>
    <!-- Page lines (left) -->
    <line x1="15" y1="45" x2="68" y2="40" stroke="#3657C8" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
    <line x1="15" y1="65" x2="68" y2="60" stroke="#3657C8" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
    <line x1="15" y1="85" x2="68" y2="80" stroke="#3657C8" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
    <line x1="15" y1="105" x2="68" y2="100" stroke="#3657C8" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
    <!-- Page lines (right) -->
    <line x1="92" y1="40" x2="145" y2="45" stroke="#24A58A" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <line x1="92" y1="60" x2="145" y2="65" stroke="#24A58A" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <line x1="92" y1="80" x2="145" y2="85" stroke="#24A58A" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <line x1="92" y1="100" x2="145" y2="105" stroke="#24A58A" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <!-- Spine -->
    <line x1="80" y1="10" x2="80" y2="155" stroke="#24A58A" stroke-width="4" stroke-linecap="round"/>
    <!-- Green accent on right page -->
    <path d="M80,155 C100,148 140,145 160,160" fill="none" stroke="#24A58A" stroke-width="3"/>
  </g>
  <!-- Small engineering symbols decorations -->
  <g opacity="0.6">
    <!-- Compass/protractor arc top-right -->
    <path d="M380,95 A30,30 0 0,1 410,125" fill="none" stroke="#24A58A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="395" cy="110" r="3" fill="#24A58A"/>
    <!-- Small triangle bottom-left -->
    <polygon points="95,380 125,380 110,355" fill="none" stroke="#3657C8" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
